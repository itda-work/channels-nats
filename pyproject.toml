[project]
name = "channels-nats"
version = "0.1.0"
description = "NATS-backed channel layer for Django Channels: one Go binary instead of Redis, Windows-friendly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "itda-work" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "channels>=4,<5",
    "nats-py>=2.6,<3",
]

[project.optional-dependencies]
msgpack = ["msgpack>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "pyright",
    "msgpack>=1.0",
    "django>=4.2",
]

[project.urls]
Repository = "https://github.com/itda-work/channels-nats"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["channels_nats"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["channels_nats"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.10"
include = ["channels_nats"]
reportPrivateUsage = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["integration: needs a nats-server binary"]
testpaths = ["tests"]
