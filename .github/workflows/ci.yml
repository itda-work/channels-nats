name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NATS_VERSION: v2.14.6

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv dropped its floating major tags in v8.
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install ${{ matrix.python-version }}

      - name: Install nats-server
        run: |
          curl -sL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-${NATS_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Type checking is platform-independent; one job is enough to catch a regression.
      - if: matrix.python-version == '3.13'
        run: uv run pyright
      - run: uv run pytest -v
