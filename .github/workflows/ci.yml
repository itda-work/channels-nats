name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NATS_VERSION: v2.14.6

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}

      - name: Install nats-server (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz
          echo "$PWD/nats-server-${NATS_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Install nats-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/$env:NATS_VERSION/nats-server-$env:NATS_VERSION-windows-amd64.zip" -OutFile nats.zip
          Expand-Archive nats.zip -DestinationPath nats
          "$PWD\nats\nats-server-$env:NATS_VERSION-windows-amd64" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -v
